<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Notre site</title>
  <link rel="stylesheet" href="css/ligne.css">
</head>
<body>
  <main class="container">
    <a href="index.html" class="back-link">&larr; Retour à l'accueil</a>
    <h1>Contactez-nous</h1>
    <p>Une question ? Un projet ? Envoyez-nous un message.</p>

    <form class="contact-form">
      <div class="form-group">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="votre.email@exemple.com" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Votre message..." required></textarea>
      </div>

      <button type="submit" class="btn">Envoyer</button>
    </form>
    <div class="copyright" style="margin-top: 2rem; font-size: 0.85rem; color: #888;">
      &copy; BOUCKITA NGOMA MOUN.
    </div>
  </main>
</body>
</html>
